name: QAaaS - Esteira de Testes Automatizados

# O gatilho: Roda toda vez que houver um "push" (código novo)
on: [push]

jobs:
  executar_testes:
    runs-on: ubuntu-latest # O ambiente Linux de execução
    
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v3

      - name: Configurar o Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependências (QAaaS)
        run: |
          pip install -r requirements.txt
          playwright install --with-deps

      - name: Executar Bateria de Testes de Regressão
        run: pytest --html=relatorio_qaaas.html --self-contained-html --junitxml=resultados.xml

      - name: Exibir Dashboard Executivo de KPIs
        if: always() # Garante que o painel apareça mesmo se os testes falharem
        run: python gerador_kpis.py

      - name: Salvar Relatório Dashboard (SLA 24h)
        uses: actions/upload-artifact@v4
        if: always() # Garante que o relatório seja salvo mesmo se o teste falhar
        with:
          name: Relatorio-Qualidade
          path: relatorio_qaaas.html